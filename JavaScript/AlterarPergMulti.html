<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar Perguntas de Multipla Escolha.</title>
    <script>
        let indexPerg = -1;
        function procurar(event) {
            event.preventDefault();
            const num = document.getElementById('numBusca').value;
            let perguntas = JSON.parse(localStorage.getItem('perguntasMulti') || '[]');
            indexPerg = perguntas.findIndex(p => p.numero == num);

            if (indexPerg !== -1) {
                document.getElementById('formAlterar').style.display = 'block';
                document.getElementById('numExibido').innerText = perguntas[indexPerg].numero;
                document.getElementById('novoPerg').value = perguntas[indexPerg].pergunta;
                document.getElementById('novoOp1').value = perguntas[indexPerg].op1;
                document.getElementById('novoOp2').value = perguntas[indexPerg].op2;
                document.getElementById('novoOp3').value = perguntas[indexPerg].op3;
                document.getElementById('novoOpture').value = perguntas[indexPerg].optrue;
            } else { alert("Pergunta não encontrada."); }
        }

        function confirmarAlteracao(event) {
            event.preventDefault();
            let perguntas = JSON.parse(localStorage.getItem('perguntasMulti'));
            perguntas[indexPerg].pergunta = document.getElementById('novoPerg').value;
            perguntas[indexPerg].op1 = document.getElementById('novoOp1').value;
            perguntas[indexPerg].op2 = document.getElementById('novoOp2').value;
            perguntas[indexPerg].op3 = document.getElementById('novoOp3').value;
            perguntas[indexPerg].optrue = document.getElementById('novoOpture').value;
            
            localStorage.setItem('perguntasMulti', JSON.stringify(perguntas));
            alert("Registro Alterado com sucesso.");
            location.reload();
        }
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h1>Alteração de Perguntas de Multipla Escolha.</h1>
    <form onsubmit="procurar(event)">
        <label>Digite o Numero da Pergunta: </label>
        <input type="text" id="numBusca" required>
        <input type="submit" value="Procurar">
    </form>
    <div id="formAlterar" style="display:none;">
        <form onsubmit="confirmarAlteracao(event)">
            <table border="1">
                <tr><th>Numero</th><th>Pergunta</th><th>Opção 1</th><th>Opção 2</th><th>Opção 3</th><th>Opção Correta</th></tr>
                <tr>
                    <td id="numExibido"></td>
                    <td><input type="text" id="novoPerg"></td>
                    <td><input type="text" id="novoOp1"></td>
                    <td><input type="text" id="novoOp2"></td>
                    <td><input type="text" id="novoOp3"></td>
                    <td><input type="text" id="novoOpture"></td>
                </tr>
            </table>
            <input type="submit" value="Alterar">
        </form>
    </div>
</body>
</html>
