<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Perguntas de Multipla Escolha.</title>
    <script>
        let perguntaEncontrada = null;

        function procurar(event) {
            event.preventDefault();
            const num = document.getElementById('numBusca').value;
            const perguntas = JSON.parse(localStorage.getItem('perguntasMulti') || '[]');
            perguntaEncontrada = perguntas.find(p => p.numero == num);

            if (perguntaEncontrada) {
                document.getElementById('areaExclusao').style.display = 'block';
                document.getElementById('infoPerg').innerHTML = `
                    <tr><td>${perguntaEncontrada.numero}</td><td>${perguntaEncontrada.pergunta}</td>
                    <td>${perguntaEncontrada.op1}</td><td>${perguntaEncontrada.op2}</td>
                    <td>${perguntaEncontrada.op3}</td><td>${perguntaEncontrada.optrue}</td></tr>`;
            } else {
                alert("Pergunta não encontrada.");
            }
        }

        function excluir() {
            let perguntas = JSON.parse(localStorage.getItem('perguntasMulti') || '[]');
            perguntas = perguntas.filter(p => p.numero != perguntaEncontrada.numero);
            localStorage.setItem('perguntasMulti', JSON.stringify(perguntas));
            alert("Registro Excluido com sucesso.");
            window.location.reload();
        }
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h1>Exclusão de Perguntas de Multipla Escolha.</h1>
    <form onsubmit="procurar(event)">
        <label for="num">Digite o Numero da Pergunta: </label>
        <input type="text" id="numBusca" required>
        <input type="submit" value="Procurar">
    </form>

    <div id="areaExclusao" style="display:none;">
        <table border="1">
            <tr><th>Numero</th><th>Pergunta</th><th>Opção 1</th><th>Opção 2</th><th>Opção 3</th><th>Opção Correta</th></tr>
            <tbody id="infoPerg"></tbody>
        </table>
        <button onclick="excluir()">Confirmar Exclusão</button>
    </div>
</body>
</html>
