<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - BEAUTIES</title>
    <link rel="stylesheet" href="estilo.css">
    <script>
        function CarregarDadosPerfil() {
            let idUser = sessionStorage.getItem("usuario_id");
            if (!idUser) {
                alert("Sessão expirada. Faça login novamente.");
                window.location.href = "index.html";
                return;
            }

            let dados = JSON.stringify({ "id": idUser });
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let res = JSON.parse(this.responseText);
                    if (res.status === "sucesso") {
                        document.getElementById("nomeInput").value = res.usuario.nome;
                        document.getElementById("emailInput").value = res.usuario.email;
                        
                        if(document.getElementById("planoUser")) {
                            document.getElementById("planoUser").textContent = res.usuario.plano || "Nenhum";
                        }
                    }
                }
            };
            xmlhttp.open("POST", "BuscarPerfil.php");
            xmlhttp.setRequestHeader("Content-Type", "application/json");
            xmlhttp.send(dados);
        }

        function SalvarAlteracoes() {
            let idUser = sessionStorage.getItem("usuario_id");
            let novoNome = document.getElementById("nomeInput").value;
            let novoEmail = document.getElementById("emailInput").value;

            if (novoNome.trim() === "" || novoEmail.trim() === "") {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            let dados = JSON.stringify({
                "id": idUser,
                "nome": novoNome,
                "email": novoEmail
            });

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let res = JSON.parse(this.responseText);
                    alert(res.mensagem);
                    if (res.status === "sucesso") {
                        window.location.href = "home.html";
                    }
                }
            };
            xmlhttp.open("POST", "AtualizarPerfil.php");
            xmlhttp.setRequestHeader("Content-Type", "application/json");
            xmlhttp.send(dados);
        }
    </script>
</head>
<body onload="CarregarDadosPerfil()">
    <div class="container">
        <h2>Meu Perfil</h2>
        <p style="margin-bottom: 25px; color: #ccc;">Edite suas informações cadastrais</p>

        <div class="perfil-info" style="text-align: left; width: 100%;">
            <label style="color: #aaa; font-size: 14px; display: block; margin-bottom: 5px;">Nome Completo:</label>
            <input type="text" id="nomeInput" style="margin-bottom: 15px; width: 100%;" placeholder="Seu nome">

            <label style="color: #aaa; font-size: 14px; display: block; margin-bottom: 5px;">E-mail de Acesso:</label>
            <input type="email" id="emailInput" style="margin-bottom: 15px; width: 100%;" placeholder="Seu e-mail">
            
            <p style="color: #aaa; font-size: 14px; margin-top: 10px;">
                Plano de Assinatura: <strong id="planoUser" style="color: #c9a227;">Carregando...</strong>
            </p>
        </div>

        <button type="button" class="btn-principal" style="margin-top: 20px; background-color: #00ff7f; color: #000; font-weight: bold;" onclick="SalvarAlteracoes()">
             Salvar Alterações
        </button>

        <button type="button" class="btn-principal" style="background-color: #333; margin-top: 10px;" onclick="window.location.href='home.html'">
            Voltar
        </button>
    </div>
</body>
</html>
