<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nossos Serviços</title>
    <link rel="stylesheet" href="estilo.css">
    <script>
        function CarregarServicos() {
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let servicos = JSON.parse(this.responseText);
                    let grid = document.getElementById("grid");
                    grid.innerHTML = "";

                    for (let i = 0; i < servicos.length; i++) {
                        let servico = servicos[i];
                        let card = document.createElement("div");
                        card.className = "card-servico";

                        card.innerHTML = `
                            <h3>${servico.nome}</h3>
                            <p class="preco">R$ ${servico.preco}</p>
                            <p class="duracao">⏱ ${servico.duracao}</p>
                            
                            <label style="color: #aaa; font-size: 13px; display: block; margin-top: 10px; margin-bottom: 5px;">Forma de Pagamento:</label>
                            <select id="pagamento_${servico.id}" style="width: 100%; margin-bottom: 12px; padding: 5px;">
                                <option value="Cartão de Crédito"> Cartão de Crédito</option>
                                <option value="Cartão de Débito"> Cartão de Débito</option>
                                <option value="Dinheiro Vivo"> Dinheiro Vivo</option>
                                <option value="Pix"> Pix</option>
                            </select>

                            <button class="btn-principal" onclick="Escolher(${servico.id}, '${servico.nome}')">Escolher</button>
                        `;
                        grid.appendChild(card);
                    }
                }
            };
            xmlhttp.open("GET", "ListarServicos.php");
            xmlhttp.send();
        }

        function Escolher(id, nome) {
            let formaPagamento = document.getElementById("pagamento_" + id).value;
            
            sessionStorage.setItem("servico_id", id);
            sessionStorage.setItem("servico_nome", nome);
            sessionStorage.setItem("forma_pagamento", formaPagamento);
            
            window.location.href = "agendamento.html";
        }
    </script>
</head>
<body onload="CarregarServicos()">
    <div class="container container-largo">
        <h2>Selecione o Procedimento</h2>
        <div class="grid-servicos" id="grid"></div>
        <button type="button" class="btn-principal" style="background-color: #333; max-width: 200px; margin-top: 20px; display: block; margin-left: auto; margin-right: auto;" onclick="window.location.href='home.html'">Voltar para Home</button>
    </div>
</body>
</html>
