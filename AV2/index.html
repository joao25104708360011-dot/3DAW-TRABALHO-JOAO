<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Centro de Estética - Login</title>
    <link rel="stylesheet" href="estilo.css">
    <script>
        function Logar() {
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;

            let dados = JSON.stringify({"email": email, "senha": senha});
            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let res = JSON.parse(this.responseText);
                    if (res.status === "sucesso") {
                        sessionStorage.setItem("usuario_id", res.usuario.id);
                        window.location.href = "home.html";
                    } else {
                        document.getElementById("msg").innerHTML = res.mensagem;
                        document.getElementById("msg").style.color = "red";
                    }
                }
            };
            xmlhttp.open("POST", "Login.php");
            xmlhttp.setRequestHeader("Content-Type", "application/json");
            xmlhttp.send(dados);
        }
    </script>
</head>
<body>
    <div class="container">
        <img src="LogoBeauties.png" alt="Logo Beauties" class="logo">

        <h2>Login</h2>
        <div class="grupo-campo">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="cliente@teste.com">
        </div>
        <div class="grupo-campo">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="******">
        </div>
        <button class="btn-principal" onclick="Logar()">Entrar</button>
        <p id="msg"></p>
    </div>
</body>
</html>
