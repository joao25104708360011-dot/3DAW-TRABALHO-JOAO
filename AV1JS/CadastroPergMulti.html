<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Perguntas de Multipla Escolha.</title>
    <script>
        function CadastroPergMulti(){
            let objForm = document.getElementById("formPergMulti");
            console.log("objForm: " + objForm);

            let num = document.getElementById("num").value;
            let perg = document.getElementById("perg").value;
            let op1 = document.getElementById("op1").value;
            let op2 = document.getElementById("op2").value;
            let op3 = document.getElementById("op3").value;
            let optrue = document.getElementById("optrue").value;

            if(!Validar(num, perg, op1, op2, op3, optrue)){
                return;
            }

            console.log("Número: " + num + "/// Pergunta: " + perg + "/// Opção1: " + op1 + "/// Opção2: " + op2 + "/// Opção3: " + op3 + "/// Opção True: " + optrue);

            let objForm2 = {"numero": num,"pergunta": perg,"opcao1": op1,"opcao2": op2,"opcao3": op3,"opcaoTrue": optrue};
            let objJson = JSON.stringify(objForm2);

            console.log("objForm2: " + objForm2);
            console.log("JSON: " + objJson);

            let xmlhttp = new XMLHttpRequest();
            console.log("1");
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Chegou a resposta OK: " + this.responseText);
                    console.log("2");
                    document.getElementById("msg").innerHTML = this.responseText;
                } else
                    if (this.readyState < 4) {
                        console.log("3: " + this.readyState);
                    } else
                        console.log("Requisicao falhou: " + this.status);
            }
            console.log("4");

            xmlhttp.open("POST", "http://localhost/3DAW/CadastroPergMulti.php");
            xmlhttp.setRequestHeader("Content-Type", "application/json");
            xmlhttp.send(objJson);

        }

        function Validar(num, perg, op1, op2, op3, optrue){
            const numRegex = /^([0-9]+$)/;
            const textoRegex = /^[A-Za-zÀ-ÿ0-9\s\?\!\.\,\-\:\(\)]+$/;
            const trueRegex = /^([1-3])$/;
        
            let erros = [];

            if (!numRegex.test(num)) {
                erros.push("Número inválido (use apenas números positivos e inteiros).");
            }

            if (!textoRegex.test(perg) || perg.length < 10) {
                erros.push("Pergunta inválida (mínimo 10 letras).");
            }

            if (op1 === "" || op2 === "" || op3 === "") {
                erros.push("Preencha todas as alternativas.");
            }

            if (!trueRegex.test(optrue)) {
                erros.push("A opção correta deve ser 1, 2 ou 3.");
            }

            if (erros.length > 0) {
                document.getElementById("msg").innerHTML = erros.join("<br>");
                document.getElementById("msg").style.color = "red";
                return false;
            }

            return true;
        }
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h1>Cadastro de Perguntas de Multipla Escolha.</h1>
    <form method="POST" id="formPergMulti" name="formPergMulti">
        <label for="num">Numero: </label>
        <input type="text" name="num" id="num" required>
        <br>
        <label for="perg">Pergunta: </label>
        <input type="text" name="perg" id="perg" required>
        <br>
        <label for="op1">Opção 1: </label>
        <input type="text" name="op1" id="op1" required>
        <br>
        <label for="op2">Opção 2: </label>
        <input type="text" name="op2" id="op2" required>
        <br>
        <label for="op3">Opção 3: </label>
        <input type="text" name="op3" id="op3" required>
        <br>
        <label for="optrue">Opção correta: (número)</label>
        <input type="text" name="optrue" id="optrue" required>
        <br>
        <input type="button" value="Cadastrar" onclick="return CadastroPergMulti();">
    </form>
<p id="msg"></p>
</body>
</html>
