<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incluir Aluno</title>
    <script>
         function EnviarAluno() {
            let objForm = document.getElementById("formAluno");
            console.log("objForm: " + objForm.innerHTML);

            let matricula = document.getElementById("matricula").value;
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;

            if (!ValidaForm(matricula, nome, email)) {
                return;
            }


            console.log("Matricula: " + matricula + " nome: " + nome + " email: " + email);

            let objForm2 = {"matricula": matricula,"nome":nome,"email":email};
            let objJson = JSON.stringify(objForm2);

            console.log("objForm2: " + objForm2);
            console.log("JSON: " + objJson);

            let xmlhttp = new XMLHttpRequest();
            console.log("1");
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Chegou a resposta OK: " + this.responseText);
                    console.log("2");
                    document.getElementById("msg").innerHTML = this.responseText;
                } else
                    if (this.readyState < 4) {
                        console.log("3: " + this.readyState);
                    } else
                        console.log("Requisicao falhou: " + this.status);
            }
            console.log("4");
            xmlhttp.open("POST", "http://localhost/3DAW/IncluirAluno.php");
            xmlhttp.setRequestHeader("Content-Type", "application/json");
            xmlhttp.send(objJson);

            console.log("4");
 //           xmlhttp.open("GET", "http://localhost/3daw/ex52_IncluirAluno.php?matricula=" + matricula +
 //                          "&nome=" + nome + "&email=" + email);
 //           xmlhttp.send();
  //          console.log("enviei form");
 //           console.log("5");
        }

        function ValidaForm(pmatricula, pnome, pemail) {
            const regexMatricula = /^([0-9])+$/;
            const regexNome = /^[A-Za-zÀ-ÿ ]+$/;
            const regexEmail = /^([a-z0-9\.\-_]{2,})@([a-z0-9]{2,})(\.[a-z]{2,})(\.[a-z]{2,})?$/i;
            //telefone
            //(\([0-9]{2}\))\s([0-9]{1})?([0-9]{4})\-([0-9]{4})
            let erros = [];

            if (!regexMatricula.test(pmatricula)) {
                erros.push("Matrícula inválida (use apenas números).");
            }

            if (!regexNome.test(pnome) || pnome.length < 3) {
                erros.push("Nome inválido (mínimo 3 letras, sem números).");
            }

            if (!regexEmail.test(pemail)) {
                erros.push("Formato de e-mail inválido.");
            }

            if (erros.length > 0) {
                document.getElementById("msg").innerHTML = erros.join("<br>");
                document.getElementById("msg").style.color = "red";
                return false;
            }

            return true;
        }
    </script>
</head>
<body>
<h1>Inserir Aluno</h1>
<br>
<a href="ex52_IncluirAlunoJS.html">Inserir Aluno</a><br>
<a href="ex52_alterarAluno.html">Alterar Aluno</a><br>
<a href="ex52_listarAlunos.html">Listar Alunos</a><br>
<a href="ex52_excluirAluno.html">Excluir Aluno</a><br>
<a href="ex52_detalheAluno.html">Detalhe de Aluno</a><br>
<br>
<form action="" method=POST name="formAluno" id="formAluno">
    Matricula: <input type=text name="matricula" id="matricula" required> <br>
    nome: <input type=text name="nome" id="nome"> <br>
    email: <input type=text name="email" id="email"> <br>
    <br><br>
    <input type="button" value="Inserir" onclick="return EnviarAluno();">
</form>
<p id="msg"></p>
<br>
</body>
</html>
